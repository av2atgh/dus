[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dus"
version = "0.1.0"
description = "Dependency Uprise Structure (DUS) of a directed acyclic graph, with fishplot visualisation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.5",
    "pyarrow>=6.0",
]

[project.urls]
Repository = "https://github.com/av2atgh/dus"

[tool.setuptools.packages.find]
include = ["dus*"]
exclude = ["examples*"]
